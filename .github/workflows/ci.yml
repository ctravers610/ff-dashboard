name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres for the database tests. Credentials match the app's
    # default DATABASE_URL, so no extra configuration is needed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ffd
          POSTGRES_PASSWORD: ffd_dev_password
          POSTGRES_DB: ffd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffd -d ffd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails if schema.ts was changed without generating a migration for it.
      - name: Check migrations are up to date
        run: |
          npm run db:generate -w @ffd/api
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::schema.ts changed without a migration. Run: npm run db:generate -w @ffd/api"
            git status --porcelain apps/api/drizzle
            exit 1
          fi

      - name: Unit and database tests
        run: npm test

      - name: Build (web app and API bundle)
        run: npm run build

  # The analytics loader (analytics/): its tests run against a real Postgres too.
  analytics:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ffd
          POSTGRES_PASSWORD: ffd_dev_password
          POSTGRES_DB: ffd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffd -d ffd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: analytics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analytics/pyproject.toml

      - name: Install the loader
        run: pip install -e ".[dev]"

      - name: Loader tests
        run: pytest

  # The real app, end to end: Chromium drives the production web build, the real
  # API and a real Postgres, against a fake server standing in for Sleeper and ESPN.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ffd
          POSTGRES_PASSWORD: ffd_dev_password
          POSTGRES_DB: ffd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffd -d ffd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      # The HTML report and failure traces (screenshots, network, DOM snapshots) make a CI failure debuggable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # The production image: build it, run it against a real Postgres the way a
  # host would, and smoke-test it with the same script used after a deploy.
  container:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ffd
          POSTGRES_PASSWORD: ffd_dev_password
          POSTGRES_DB: ffd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffd -d ffd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the image
        run: docker build -t fantasy-dashboard:ci --build-arg GIT_COMMIT=${{ github.sha }} .

      - name: Run the container
        run: |
          # Sign-in on, as in production. These GitHub values are placeholders:
          # the smoke test checks the redirect to GitHub but never follows it.
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://ffd:ffd_dev_password@127.0.0.1:5432/ffd \
            -e API_PORT=3001 \
            -e PUBLIC_URL=https://ffd.example.com \
            -e GITHUB_CLIENT_ID=ci-client-id \
            -e GITHUB_CLIENT_SECRET=ci-client-secret \
            -e GITHUB_ALLOWED_USER_IDS=1 \
            fantasy-dashboard:ci

      - name: Smoke test (must be running this exact commit)
        run: node scripts/smoke-test.mjs http://127.0.0.1:3001 ${{ github.sha }}

      - name: Container logs
        if: always()
        run: docker logs app
