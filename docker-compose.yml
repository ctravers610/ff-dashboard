# Local development database. Start it with `docker compose up -d`.
# These credentials are for a database that only listens on localhost.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ffd_dev_password}
      POSTGRES_DB: ffd
    ports:
      - '127.0.0.1:5432:5432' # bound to localhost so nothing else on your network can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data # survives container restarts and recreation
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ffd -d ffd']
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image, run locally: `docker compose --profile app up --build`,
  # then open http://localhost:8080. Not started by a plain `docker compose up`.
  app:
    profiles: [app]
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      db:
        condition: service_healthy
    # Your accounts from .env (if present), as a deployed instance would get them from the host.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ffd:${POSTGRES_PASSWORD:-ffd_dev_password}@db:5432/ffd
      API_PORT: '3001'
    ports:
      - '127.0.0.1:8080:3001'

volumes:
  pgdata:
