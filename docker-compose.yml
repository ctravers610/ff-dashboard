# Local development database. Start it with `docker compose up -d`.
# These credentials are for a database that only listens on localhost.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ffd_dev_password}
      POSTGRES_DB: ffd
    ports:
      - '127.0.0.1:5432:5432' # bound to localhost so nothing else on your network can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data # survives container restarts and recreation
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ffd -d ffd']
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image, run locally: `docker compose --profile app up --build`,
  # then open http://localhost:8080. Not started by a plain `docker compose up`.
  app:
    profiles: [app]
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      db:
        condition: service_healthy
    # Your accounts from .env (if present), as a deployed instance would get them from the host.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ffd:${POSTGRES_PASSWORD:-ffd_dev_password}@db:5432/ffd
      API_PORT: '3001'
      PUBLIC_URL: http://localhost:8080
      # Sign-in needs https, which this local preview doesn't have, so it runs open.
      # That's safe only because the port below is bound to this computer alone.
      AUTH_DISABLED: '1'
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      GITHUB_ALLOWED_USER_IDS: ''
    ports:
      - '127.0.0.1:8080:3001'

  # The public demo in the production image: made-up leagues, no sign-in,
  # read-only. `docker compose --profile demo up --build`, then
  # http://localhost:8090. Its own throwaway database, so it never sees yours.
  demo-db:
    profiles: [demo]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ffd
      POSTGRES_PASSWORD: ffd_demo_password
      POSTGRES_DB: ffd_demo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ffd -d ffd_demo']
      interval: 5s
      timeout: 3s
      retries: 10
  demo:
    profiles: [demo]
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      demo-db:
        condition: service_healthy
    environment:
      DEMO_MODE: '1'
      DATABASE_URL: postgres://ffd:ffd_demo_password@demo-db:5432/ffd_demo
      API_PORT: '3001'
      PUBLIC_URL: http://localhost:8090
    ports:
      - '127.0.0.1:8090:3001'

  # The analytics warehouse on Airflow (analytics/orchestration): the daily DAG
  # that loads, builds and tests it. `docker compose --profile airflow up --build`,
  # then http://localhost:8081, signing in as admin with the password in
  # `docker compose logs airflow`. Uses the local database above.
  airflow:
    profiles: [airflow]
    build:
      context: ./analytics
      dockerfile: orchestration/Dockerfile
    command: standalone
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/analytics/orchestration/dags
      # The loader: where to write, and the app database it reads (Sleeper
      # accounts added in the app, History, the live feed).
      ANALYTICS_DATABASE_URL: postgres://ffd:${POSTGRES_PASSWORD:-ffd_dev_password}@db:5432/ffd_analytics
      APP_DATABASE_URL: postgres://ffd:${POSTGRES_PASSWORD:-ffd_dev_password}@db:5432/ffd
      # dbt's profile (analytics/warehouse/profiles.yml).
      ANALYTICS_DB_HOST: db
      ANALYTICS_DB_PASSWORD: ${POSTGRES_PASSWORD:-ffd_dev_password}
    volumes:
      - ./analytics:/opt/analytics
    ports:
      - '127.0.0.1:8081:8080'

volumes:
  pgdata:
