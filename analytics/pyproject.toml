[project]
name = "ffd-analytics"
version = "0.1.0"
description = "Loads fantasy league data into the analytics database's raw schema"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
