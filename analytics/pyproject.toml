[project]
name = "ffd-analytics"
version = "0.1.0"
description = "The analytics warehouse: a loader for the raw schema, and dbt models over it"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "dbt-core>=1.12,<1.13",
  "dbt-postgres>=1.11,<1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
