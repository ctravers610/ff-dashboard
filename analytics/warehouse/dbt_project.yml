# The warehouse: dbt models over the raw schema the loader fills (../loader).
name: ffd
version: '1.0.0'
profile: ffd

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
seed-paths: [seeds]
snapshot-paths: [snapshots]
clean-targets: [target, dbt_packages, logs]

seeds:
  ffd:
    +schema: reference

models:
  ffd:
    staging:
      # One model per raw table: the current version of each item, as typed columns.
      +schema: staging
      +materialized: view
    intermediate:
      # Building blocks the marts share: lineup slots, best lineups, paired matchups.
      +schema: intermediate
      +materialized: view
    marts:
      # The star schema: dim_ and fct_ tables, the layer to query.
      +schema: marts
      +materialized: table
    metrics:
      # MetricFlow's time spine; the semantic models and metrics live beside it.
      +schema: marts
      +materialized: table
