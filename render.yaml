# Render Blueprint: both services, built from the Dockerfile. In Render: New >
# Blueprint, pick this repository, then fill in the values marked sync: false
# (Render asks for them once and never stores them in git). Databases live on
# Neon; see "Deploying" in the README.

services:
  # Your dashboard, behind GitHub sign-in. On the free plan it sleeps after
  # about 15 minutes without visitors, and reminders and the live feed (timers
  # inside the app) only run while it's awake. Change plan to starter (paid,
  # always on) to have them run all the time.
  - type: web
    name: ffd-app
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass # only after CI passes on the commit
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_URL # e.g. https://ffd-app.onrender.com, no trailing slash
        sync: false
      - key: DATABASE_URL # Neon connection string for the ffd database
        sync: false
      - key: ANALYTICS_DATABASE_URL # optional: ffd_analytics as its read-only role (README, "Hosting the warehouse")
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_ALLOWED_USER_IDS
        sync: false
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      - key: YAHOO_COOKIE # optional: losing FAAB bids in Yahoo leagues
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: YAHOO_CLIENT_ID # from your Yahoo app (developer.yahoo.com/apps)
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY # only used with Yahoo; a random 32-byte key
        generateValue: true

  # The public demo: made-up leagues, no sign-in, read-only. Free plan: it
  # sleeps when nobody is looking and takes a few seconds to wake.
  - type: web
    name: ffd-demo
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: '1'
      - key: PUBLIC_URL # e.g. https://ffd-demo.onrender.com
        sync: false
      - key: DATABASE_URL # Neon connection string for the ffd_demo database
        sync: false
